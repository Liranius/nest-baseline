name: nest-baseline
services:
  dev-db:
    image: postgres:18
    profiles: [dev]
    environment:
      POSTGRES_DB: booking_dev
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD}
    ports: ['127.0.0.1:${BOOKING_DEV_PORT:-55431}:5432']
    volumes: [booking-dev:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking -d booking_dev']
      interval: 2s
      timeout: 2s
      retries: 30
  test-db:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD}
    ports: ['127.0.0.1:${BOOKING_TEST_PORT:-55432}:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking -d booking_test']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  booking-dev: {}
