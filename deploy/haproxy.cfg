global
    stats socket /control/admin.sock mode 600 level admin
defaults
    mode http
    timeout connect 2s
    timeout client 12s
    timeout server 12s
frontend public
    bind :8080
    acl pickup_route path_reg -i /pickup-location/?$
    acl pickup_open str(open) -m str -f virt@pickup
    http-request deny deny_status 503 if pickup_route !pickup_open
    default_backend booking
backend booking
    balance roundrobin
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    http-response set-header X-Booking-Slot %[srv_name]
    default-server inter 250ms fastinter 100ms rise 2 fall 1
    # The deployment command sets each verified container address before admission.
    server a 127.0.0.1:3000 check disabled
    server b 127.0.0.1:3000 check disabled
